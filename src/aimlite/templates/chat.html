<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIMLite - {{model_name}} Chat & RAG Playground</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090a0f;
      --card-bg: rgba(18, 20, 29, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #0284c7;
      --accent: #38bdf8;
      --code-bg: #06070a;
    }
    *, *:before, *:after { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .topbar {
      height: 56px;
      border-bottom: 1px solid var(--card-border);
      background: rgba(9, 10, 15, 0.9);
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      z-index: 20;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-logo {
      font-weight: 800;
      font-size: 17px;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .layout-body {
      flex: 1;
      display: flex;
      overflow: hidden;
    }
    .sidebar {
      width: 280px;
      border-right: 1px solid var(--card-border);
      background: rgba(14, 16, 24, 0.5);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    @media (max-width: 768px) {
      .sidebar { display: none; }
    }
    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--bg);
    }
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .msg-row {
      display: flex;
      gap: 12px;
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
    }
    .msg-row.user { justify-content: flex-end; }
    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      shrink: 0;
    }
    .avatar.ai { background: linear-gradient(135deg, #0284c7, #6366f1); color: #fff; }
    .avatar.user { background: #334155; color: #fff; }
    .bubble {
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.5;
      max-width: 85%;
    }
    .bubble.ai {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: #e2e8f0;
    }
    .bubble.user {
      background: var(--primary);
      color: #fff;
    }
    .sources-box {
      margin-top: 10px;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.3);
      padding: 8px 12px;
      font-size: 12px;
    }
    .chat-input-container {
      padding: 16px 24px;
      border-top: 1px solid var(--card-border);
      background: rgba(9, 10, 15, 0.8);
      backdrop-filter: blur(10px);
    }
    .input-wrapper {
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      gap: 8px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 8px 12px;
    }
    .input-wrapper:focus-within {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(2, 132, 199, 0.2);
    }
    input.chat-input {
      flex: 1;
      background: transparent;
      border: none;
      color: #fff;
      font-size: 14px;
      outline: none;
    }
    .btn-send {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-send:hover { opacity: 0.9; }
    .btn-send:disabled { opacity: 0.4; cursor: not-allowed; }
    .nav-link {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 6px;
      border: 1px solid var(--card-border);
    }
    .nav-link:hover { color: #fff; border-color: rgba(255, 255, 255, 0.2); }
  </style>
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <span class="brand-logo">AIMLite Chat</span>
      <span style="font-size:12px; color:var(--text-muted);">{{model_name}}</span>
    </div>
    <div style="display:flex; gap:8px;">
      <a href="/" class="nav-link">⚡ Playground</a>
      <a href="/docs" class="nav-link">📖 Docs</a>
    </div>
  </header>

  <div class="layout-body">
    <aside class="sidebar">
      <div>
        <div style="font-size:11px; text-transform:uppercase; color:var(--text-muted); font-weight:600; margin-bottom:8px;">Active Model</div>
        <div style="font-family:'JetBrains Mono', monospace; font-size:13px; color:#38bdf8;">{{model_name}}</div>
      </div>

      <div>
        <div style="font-size:11px; text-transform:uppercase; color:var(--text-muted); font-weight:600; margin-bottom:8px;">Prompt Presets</div>
        <div style="display:flex; flex-direction:column; gap:6px;">
          <button onclick="usePrompt('How does LoRA low-rank adaptation work?')" style="text-align:left; background:rgba(255,255,255,0.03); border:1px solid var(--card-border); color:var(--text-muted); padding:8px; border-radius:6px; font-size:12px; cursor:pointer;">LoRA Adaptation</button>
          <button onclick="usePrompt('Summarize the core concepts in the knowledge base.')" style="text-align:left; background:rgba(255,255,255,0.03); border:1px solid var(--card-border); color:var(--text-muted); padding:8px; border-radius:6px; font-size:12px; cursor:pointer;">Knowledge Base Summary</button>
        </div>
      </div>

      <div style="margin-top:auto;">
        <div style="font-size:11px; color:var(--text-muted);">Latency: <span id="chatLatency" style="color:#34d399;">--</span></div>
      </div>
    </aside>

    <main class="chat-area">
      <div class="chat-messages" id="messagesList">
        <div class="msg-row ai">
          <div class="avatar ai">AI</div>
          <div class="bubble ai">
            Welcome to the <strong>AIMLite Interactive Chat & RAG Playground</strong>. Ask questions to run inference and retrieve grounded answers from <code>{{model_name}}</code>.
          </div>
        </div>
      </div>

      <div class="chat-input-container">
        <div class="input-wrapper">
          <input type="text" class="chat-input" id="chatInput" placeholder="Ask anything about your model or data..." onkeydown="if(event.key==='Enter') sendChatMessage()">
          <button class="btn-send" id="sendBtn" onclick="sendChatMessage()">Send</button>
        </div>
      </div>
    </main>
  </div>

  <script>
    function usePrompt(text) {
      document.getElementById('chatInput').value = text;
      sendChatMessage();
    }

    async function sendChatMessage() {
      const input = document.getElementById('chatInput');
      const text = input.value.trim();
      if (!text) return;

      const list = document.getElementById('messagesList');
      const sendBtn = document.getElementById('sendBtn');
      const latencyBadge = document.getElementById('chatLatency');

      // Add user message
      const userRow = document.createElement('div');
      userRow.className = 'msg-row user';
      userRow.innerHTML = `<div class="bubble user">${text}</div><div class="avatar user">U</div>`;
      list.appendChild(userRow);
      input.value = '';
      sendBtn.disabled = true;
      list.scrollTop = list.scrollHeight;

      // Add loader
      const loader = document.createElement('div');
      loader.className = 'msg-row ai';
      loader.innerHTML = `<div class="avatar ai">AI</div><div class="bubble ai" style="color:var(--text-muted);">Thinking...</div>`;
      list.appendChild(loader);
      list.scrollTop = list.scrollHeight;

      const t0 = performance.now();
      try {
        const res = await fetch('/predict', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query: text, features: text })
        });
        const elapsed = Math.round(performance.now() - t0);
        latencyBadge.textContent = `${elapsed} ms`;
        const data = await res.json();
        loader.remove();

        const aiRow = document.createElement('div');
        aiRow.className = 'msg-row ai';

        if (!res.ok || data.status === 'error') {
          const errMsg = data.message || JSON.stringify(data, null, 2);
          aiRow.innerHTML = `<div class="avatar ai" style="background:#ef4444; color:#fff;">!</div><div class="bubble ai" style="border:1px solid rgba(239,68,68,0.4); color:#f87171;">⚠️ <strong>Model Error:</strong><br><pre style="margin:4px 0 0 0; font-size:11px; white-space:pre-wrap;">${errMsg}</pre></div>`;
          list.appendChild(aiRow);
          return;
        }

        let content = '';
        if (typeof data.result === 'string') {
          content = data.result;
        } else if (data.result && typeof data.result === 'object') {
          content = data.result.answer || data.result.text || `<pre style="margin:0; font-size:12px;">${JSON.stringify(data.result, null, 2)}</pre>`;
        } else {
          content = `<pre style="margin:0; font-size:12px;">${JSON.stringify(data, null, 2)}</pre>`;
        }

        aiRow.innerHTML = `<div class="avatar ai">AI</div><div class="bubble ai">${content}</div>`;
        list.appendChild(aiRow);
      } catch (err) {
        loader.remove();
        const errRow = document.createElement('div');
        errRow.className = 'msg-row ai';
        errRow.innerHTML = `<div class="avatar ai">AI</div><div class="bubble ai" style="color:#ef4444;">Error: ${err.message}</div>`;
        list.appendChild(errRow);
      } finally {
        sendBtn.disabled = false;
        list.scrollTop = list.scrollHeight;
      }
    }
  </script>
</body>
</html>
