<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AIMLite - Documentation & Framework Guide</title>
  <meta name="description"
    content="Official documentation for AIMLite (v1.0.7): Standardized, zero-path machine learning, parameter-efficient LoRA fine-tuning, and enterprise RAG with multi-model serving and adaptive web apps." />
  <!-- Inline Theme Initializer to prevent flash -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('aimlite_theme');
        var isDark = saved === 'dark' || (saved !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (isDark) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) { }
    })();
  </script>
  <!-- Modern Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
</head>

<body class="bg-zinc-50 dark:bg-[#09090b] text-zinc-900 dark:text-zinc-100 transition-colors duration-150">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
