[project]
name = "modelkit"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mickyas Tesfaye", email = "alazartesfaye42@gmail.com" },
    { name = "Beamlak Tadesse", email = "atocodes@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
modelkit = "cli.main:main"
cli = "cli.main:main"
test = "cli.test:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cli", "src/modelkit"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["test"]
python_files = ["test_*.py", "*_test.py", "main.py"]

