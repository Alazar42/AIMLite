[project]
name = "aimlite"
version = "2.1.0"
description = "The Django for AI & Machine Learning — zero-configuration, zero-path execution."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Mickyas Tesfaye", email = "alazartesfaye42@gmail.com" }, { name = "Beamlak Tadesse", email = "atocodes@gmail.com" }]
dependencies = [
  "pyfiglet>=1.0.4",
  "questionary>=2.0.0",
  "rich>=13.0.0",
]

[project.scripts]
aimlite = "aimlite.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aimlite"]

[tool.pytest.ini_options]
python_files = ["test_*.py", "*_test.py", "main.py"]
pythonpath = ["src"]
testpaths = ["test"]
