[project]
name = "aimlite"
version = "0.1.2"
description = "The Django for AI & Machine Learning — zero-configuration, zero-path execution."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Mickyas Tesfaye", email = "alazartesfaye42@gmail.com" }, { name = "Beamlak Tadesse", email = "atocodes@gmail.com" }]
dependencies = []

[project.scripts]
aimlite = "cli.main:main"
aimlite = "cli.main:main"
cli = "cli.main:main"
test = "cli.test:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cli", "src/aimlite"]
packages = ["src/cli", "src/aimlite"]

[tool.pytest.ini_options]
python_files = ["test_*.py", "*_test.py", "main.py"]
pythonpath = ["src"]
testpaths = ["test"]
