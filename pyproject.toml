[project]
name = "modelkit"
version = "0.1.0"
description = "The Django for Machine Learning & AI — zero-configuration, zero-path execution."
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "Mickyas Tesfaye", email = "alazartesfaye42@gmail.com" }, { name = "Beamlak Tadesse", email = "atocodes@gmail.com" }]
dependencies = []

[project.scripts]
cli = "cli.main:main"
modelkit = "cli.main:main"
test = "cli.test:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cli", "src/modelkit"]

[tool.pytest.ini_options]
python_files = ["test_*.py", "*_test.py", "main.py"]
pythonpath = ["src"]
testpaths = ["test"]
